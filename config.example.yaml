# Meshtastic MQTT broker configuration.
# Copy to config.yaml (git-ignored), adjust, and mount it read-only into the container.

listener:
  bind_address: 0.0.0.0   # IPv4 or IPv6 literal; "::" listens on IPv6 only
  port: 1883              # plain MQTT, no TLS in this version

# verbose | debug | information | warning | error | fatal
# "information": connections, auth failures and refusals (warning), and every 60 s a count of dropped publishes
# per reason. "debug" also logs every accepted and dropped packet (topic, client, from, id, portnum; never the payload).
log_level: information

# Drop channel packets that do not decrypt with the key configured for their channel
# (private channels, wrong keys, garbage).
drop_undecryptable: true

# Drop PKI-encrypted direct messages (topic <root>/2/e/PKI/<gateway>). The broker can never decrypt
# them; set to false to pass them through opaquely so that downlink gateways can deliver DMs.
drop_pki: true

# Key for any channel not listed under `channels` (AQ== = the firmware default key).
default_psk: "AQ=="

# Channel name (exactly as the firmware sends it in channel_id / the topic) -> base64 PSK.
# Names are case-sensitive: the firmware hashes the exact name, so "Test" and "test" are different channels
# (an unlisted "test" uses default_psk). An empty key is an error; "AA==" means no encryption.
# Single-byte keys follow the firmware expansion: AQ== is the default key, Ag== the default key + 1, etc.
# Source: meshtastic-es-community.github.io (docs/guias-basicas/configuracion-inicial.mdx and
# src/components/MeshtasticConfigGenerator/config.ts). SFNarrow, Iberia and the provincial channels,
# Zaragoza included, use the default key and need no entry.
channels:
  Test: "Ag=="
  Bots: "Ag=="
  Valencia: "VA=="   # byte 84; note that "Va==" would be a different key

# Protection against hostile clients. These are the defaults; the section can be left out.
limits:
  # Largest MQTT packet accepted (fixed-header Remaining Length, bytes). Checked before the broker allocates
  # the packet, so it also bounds unauthenticated CONNECTs. Firmware packets are far smaller: a ServiceEnvelope
  # carries at most a 256-byte MeshPacket plus a few dozen bytes of ids, and the firmware's MQTT client buffer
  # is 1024 bytes. 4096 leaves room for long topics and MQTT 5 properties. Range 512-1048576.
  max_packet_size: 4096
  # How long a client may take to send CONNECT, and how long a write may stall, in seconds (MQTTnet: 100).
  communication_timeout_seconds: 10
  # A login waits at most this long (seconds) for a password-hashing slot; then it gets "server unavailable"
  # and the client retries later. Logins that match an already verified password do not wait.
  auth_queue_timeout_seconds: 3
  # Distinct password checks that may run or wait at once (configured users and unknown usernames have
  # separate queues of this size). Further logins get "server unavailable" without hashing anything.
  auth_max_pending: 64
  # Distinct password checks one configured username may have pending at once; usernames are served in turn,
  # so wrong passwords for the public meshdev user cannot fill the queue or delay another user's login.
  auth_max_pending_per_user: 4
  # Connections one IP address may hold open at once. Enforced when the connection is accepted, before any
  # MQTT byte is read: over the cap the socket is closed at once. 0 turns the cap off. Every client behind
  # one NAT, one CGNAT or one VPN shares an address: raise it or turn it off for those.
  max_connections_per_ip: 16
  # Connections one IP address may open per minute (a token bucket, with the burst below). Enforced on
  # accept, so it bounds a flood of CONNECTs and password guesses from a single address. 0 turns it off.
  connect_rate_per_ip_per_minute: 30
  # Burst of the connect rate: how many connections one address may open at once. 0 turns the rate off.
  connect_burst_per_ip: 10
  # Largest publish payload accepted, in bytes. Checked in the publish hook, after the publish ACL and
  # before the packet is parsed. A firmware envelope is a few hundred bytes at most. Cannot be larger than
  # max_packet_size. Range 64-max_packet_size.
  max_payload_size: 512
  # Publishes one client may send per minute (a token bucket, with the burst below). The key is the user
  # that owns the session plus the client id; the budget dies with the session. 0 turns the rate off.
  publish_rate_per_client_per_minute: 120
  # Burst of the per-client publish rate: how many publishes one client may send at once. 0 turns it off.
  publish_burst_per_client: 60
  # How long a packet is remembered for the cross-gateway dedupe, in seconds. 0 turns the dedupe off:
  # then every copy of a packet counts separately against the per-`from` budget below.
  dedupe_window_seconds: 120
  # How many gateways may send the same packet before the further copies are dropped. One copy per gateway
  # is kept on purpose: the dashboards show who heard a packet and at what SNR.
  dedupe_max_gateways_per_packet: 32
  # How many packets are remembered for the dedupe at once; the oldest are evicted when the cap is hit.
  # The real memory ceiling is this cap times the gateways per packet: with the defaults, 200000 packets
  # x 32 gateways = 6.4 million gateway numbers (4 bytes each, about 26 MB of raw values). The overhead is
  # on top of that: the set of gateways of one packet and the entry itself are about 0.85 KB, so the worst
  # case with the defaults is roughly 150-200 MB.
  dedupe_max_entries: 200000
  # Packets one node (the packet's `from`) may send per minute (a token bucket, with the burst below).
  # A packet is charged once, on its first copy, never once per gateway. 0 turns the rate off.
  packet_rate_per_from_per_minute: 30
  # Burst of the per-node packet rate: how many packets one node may send at once. 0 turns it off.
  packet_burst_per_from: 15
  # Failed logins one IP address may make before it is banned. Only a wrong password (or an unknown user,
  # or an unsupported authentication method) counts: a full password queue, a client-id conflict and a
  # connection refused at the accept do not. The failures are counted in the window below; the one that
  # reaches this limit bans the address for auth_ban_seconds. 0 turns the bans off. Range 0-100000.
  auth_fail_max_per_ip: 10
  # How long the failed logins of one IP address are counted, in seconds. The window starts with the first
  # failure; when it has passed, the next failure starts a new one. A successful login does not reset the
  # counter (with the public credentials an attacker could interleave a correct login between the
  # guesses). Range 10-86400.
  auth_fail_window_seconds: 600
  # How long a banned IP address is refused, in seconds. A banned address is closed at the accept, before
  # any MQTT byte is read, and its CONNECTs are refused with "banned" (0x8A) before the password is
  # checked. The sessions that were already connected are left alone. The bans live in memory: a restart
  # forgets them. Range 60-604800.
  auth_ban_seconds: 3600
  # IP ranges (CIDR, IPv4 or IPv6) whose failed logins are never counted and which are never banned. Use it
  # for the networks the real nodes share (a CGNAT, a VPN, a tunnel): one misconfigured node behind a
  # shared address would get the whole address banned. An IPv4-mapped IPv6 address (::ffff:a.b.c.d)
  # matches the IPv4 ranges. Empty by default.
  auth_ban_exempt: []
  # How many entries the bounded tables may hold at once: the per-IP, the per-client and the per-node
  # rate tables, the table of failed logins and the table of bans. The dedupe table has its own cap
  # (dedupe_max_entries) above. Range 1000-10000000.
  max_tracked_entries: 100000
  # How long an entry of a rate table survives without being used, in seconds: the per-IP, the per-client
  # and the per-node rate tables. An entry that is not used for this long is forgotten (and its budget
  # starts again from scratch). Range 60-86400.
  rate_idle_expiry_seconds: 600

users:
  # Firmware default credentials (meshdev / large4cats). Public by design, so uplink only:
  # no subscribe_allow means this user cannot subscribe to anything.
  # publish_allow: MQTT topic filters every PUBLISH topic must match; anything else is dropped (the client stays
  # connected). Root msh/EU_868 is the root the Spanish community guide tells nodes to set
  # (meshtastic-es-community.github.io, docs/mapas.md). Allowed:
  #   msh/EU_868/2/e/#     encrypted channel packets, msh/EU_868/2/e/<channel>/<gateway>
  #   msh/EU_868/2/map/    map reports; the firmware publishes them to exactly this topic, trailing slash included
  #                        (MQTT.cpp: mapTopic = root + "/2/map/"), and the broker checks they really are MapReports.
  # Generate a hash with: docker run --rm -i <image> hash-password
  - username: meshdev
    password_hash: "pbkdf2-sha256$600000$iqngz3pWU8HFZn8xIv8/IQ==$ZhdEPkHgqnG2zbHe26j6U598nTyFTA8J/Kzm7WCxDuA="
    publish_allow:
      - "msh/EU_868/2/e/#"
      - "msh/EU_868/2/map/"

  # Example downlink user: may subscribe only to filters fully inside these MQTT topic filters.
  # "msh/EU_868/2/e/#" allows msh/EU_868/2/e/# and anything below it, but never msh/# or msh/+/2/e/#.
  # publish_allow is empty on purpose: a dashboard only reads, and an empty or missing list means no publish at all.
  # - username: dashboard
  #   password_hash: "pbkdf2-sha256$600000$<salt>$<hash>"
  #   subscribe_allow:
  #     - "msh/EU_868/2/e/#"
  #   publish_allow: []
